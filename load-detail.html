<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Load Details | Truck Load Log</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#171717;background:#f5eeee}
*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(90deg,#171717,#780000,#c1121f);color:white;padding:20px;text-align:center}
main{max-width:850px;margin:24px auto;padding:24px;background:#fff;border-top:6px solid #c1121f;border-radius:12px;box-shadow:0 4px 16px #0002}
h1{margin:0;font-size:1.6rem}h2{color:#780000}
dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}dl div{padding:13px;border:1px solid #ddd;border-radius:8px;min-width:0}dt{color:#555;font-size:.85rem;margin-bottom:5px}dd{margin:0;font-size:1.1rem;overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}button,a.button{display:inline-block;padding:11px 18px;border:0;border-radius:8px;background:#780000;color:#fff;text-decoration:none;font-size:1rem;cursor:pointer}
.zero-alert{background:#b91c1c;color:white;border-color:#7f1d1d} .zero-alert dt{color:white}
@media(max-width:540px){main{margin:12px;padding:16px}dl{grid-template-columns:1fr}}
@media print{body{background:white}header{color:black;background:white}main{margin:0;max-width:none;padding:0;border:0;box-shadow:none}.actions{display:none}dl div{break-inside:avoid} .zero-alert{color:black;background:white;border:2px solid #b91c1c}.zero-alert dt{color:black}}
</style></head>
<body>
<header><h1>Truck Load Log · Individual Load</h1></header>
<main>
<h2 id="heading">Load Details</h2>
<p id="message"></p>
<dl id="details"></dl>
<div class="actions"><button type="button" onclick="window.print()">🖨️ Print This Load</button><a class="button" href="index.html">← Return to Main</a></div>
</main>
<script>
const params=new URLSearchParams(location.search);
const indexText=params.get('index');
const index=indexText!==null&&/^\d+$/.test(indexText)?Number(indexText):-1;
let entries=[];
try{const saved=JSON.parse(localStorage.getItem('entries')||'[]');if(Array.isArray(saved))entries=saved;}catch(e){}
entries.sort((a,b)=>new Date(a.date)-new Date(b.date));
const e=index>=0?entries[index]:null;
const details=document.getElementById('details');
function number(v){const n=Number(typeof v==='string'?v.replace(/[$,]/g,''):v);return Number.isFinite(n)?n:0}
function add(label,value,alertZero=false){
const wrapper=document.createElement('div');if(alertZero)wrapper.classList.add('zero-alert');
const dt=document.createElement('dt');dt.textContent=label;
const dd=document.createElement('dd');dd.textContent=String(value??'');wrapper.append(dt,dd);details.append(wrapper);
}
if(!e){
 document.getElementById('message').textContent='This load is not available in this browser. Return to the main log and search again. If you use another device, sign in and allow its cloud data to sync first.';
}else{
 const rate=number(localStorage.getItem('mileagePayGlobal')),empty=number(e.emptyMileage),loaded=number(e.loadedMileage),extra=number(e.extraIncome),total=(empty+loaded)*rate+extra;
 document.getElementById('heading').textContent='Load #'+(e.loadNumber||'N/A');
 add('Date',e.date||'N/A');add('Load Number',e.loadNumber||'N/A');add('Shipper',e.shipper||'N/A');add('Destination',e.destination||'N/A');add('Trailer Number',e.trailer||'N/A');
 add('Deadhead / Empty Miles',empty,!e.paid&&empty===0);add('Loaded Miles',loaded,!e.paid&&loaded===0);
 add('Pay Per Mile','$'+rate.toFixed(2),!e.paid&&rate===0);add('Extra Pay','$'+extra.toFixed(2),!e.paid&&extra===0);
 add('Total Pay','$'+total.toFixed(2),!e.paid&&total===0);add('Status',e.paid?'Paid':'Unpaid');
}
</script></body></html>
